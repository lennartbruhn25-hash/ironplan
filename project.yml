name: Ironplan
options:
  bundleIdPrefix: com.lennartbruhn
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Ironplan:
    type: application
    platform: iOS
    sources:
      - path: Ironplan
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lennartbruhn.ironplan
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: Config/Ironplan.entitlements
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: Ironplan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        NSCalendarsFullAccessUsageDescription: Ironplan liest deinen Stundenplan und deine Termine, um Training, Lernen und Freizeit in die freien Lücken zu legen.
        NSCalendarsUsageDescription: Ironplan liest deinen Stundenplan und deine Termine, um Training, Lernen und Freizeit in die freien Lücken zu legen.
        NSHealthShareUsageDescription: Ironplan liest deine Workouts (z. B. von Suunto) und deinen Schlaf, um sie mit deinem Trainingsplan abzugleichen.
        NSHealthUpdateUsageDescription: Ironplan trägt dein getrunkenes Wasser in Apple Health ein.
        CFBundleURLTypes:
          - CFBundleURLName: com.lennartbruhn.ironplan
            CFBundleURLSchemes: [ironplan]
schemes:
  Ironplan:
    build:
      targets:
        Ironplan: all
